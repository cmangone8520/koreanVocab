[tool.poetry]
name = "korean-vocab-backend"
version = "0.1.0"
description = "FastAPI backend for the Korean vocabulary practice app."
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.135.3"}
pydantic = "^2.12.5"
openai = "^2.31.0"
python-dotenv = "^1.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
